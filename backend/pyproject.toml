[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teletraan-backend"
version = "2.2.0"
description = "TELETRAAN-1 // NASA FIRMS PyroHarmonizer Analytical API"
authors = [{ name = "Decepticons Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "duckdb>=0.10.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "shapely>=2.0.3",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "contourpy>=1.2.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "h3>=4.1,<5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "black>=24.2.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
